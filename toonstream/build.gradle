apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

ext {
    extName = 'Toonstream'
    extClass = '.Toonstream'
    extVersionCode = 1
    libVersion = '13'
}

android {
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
