name: Build Toonstream Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Build Toonstream APK
        run: gradle :toonstream:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Toonstream-APK
          path: toonstream/build/outputs/apk/release/toonstream-release.apk
